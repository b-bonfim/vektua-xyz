name: Vinext RSC prefetch regression lab (NO DEPLOY)
on:
  push:
    branches: [fix/vinext-rsc-prefetch-20260921]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frozen install, static checks and production build
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm install --frozen-lockfile
          corepack pnpm lint
          corepack pnpm exec tsc --noEmit
          corepack pnpm build
      - name: Trace emitted Link module import binding at failing location
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root='dist/client/_next/static/chunks';
          const files=fs.readdirSync(root);const link=fs.readFileSync(path.join(root,files.find(f=>/^link-.*\.js$/.test(f))),'utf8');
          const index=fs.readFileSync(path.join(root,files.find(f=>/^index-.*\.js$/.test(f))),'utf8');
          const src=fs.readFileSync('node_modules/vinext/dist/shims/link.js','utf8');
          console.log('LINK IMPORTS',link.slice(0,1800));
          const lines=link.split('\n');console.log('FAILING LINK LINE',lines[1]?.slice(3800,5100));
          console.log('INDEX HEAD',index.slice(0,2300));console.log('INDEX TAIL',index.slice(-5000));
          console.log('INDEX export snippets', [...index.matchAll(/.{0,160}\bl\s+as\s+\w+.{0,160}|.{0,160}\b\w+\s+as\s+l\b.{0,160}/g)].slice(-12).map(m=>m[0]));
          for(const term of ['getPrefetchInterceptionContext','async function prefetchUrl','function prefetchUrl','RSC prefetch setup error']){
            const p=src.indexOf(term);console.log('SOURCE',term,'offset',p,'context',src.slice(Math.max(0,p-400),p+700));
          }
          NODE
      - name: Preserve lab diagnostics
        if: always()
        run: echo 'No deploy; this workflow is diagnostics-only.' >> "$GITHUB_STEP_SUMMARY"
