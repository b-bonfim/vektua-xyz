name: Vinext RSC prefetch regression lab (NO DEPLOY)
on:
  push:
    branches: [fix/vinext-rsc-prefetch-20260921]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frozen install, static checks and production build
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm install --frozen-lockfile
          corepack pnpm lint
          corepack pnpm exec tsc --noEmit
          corepack pnpm build
      - name: Trace emitted Link module import binding at failing location
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          function walk(root){if(!fs.existsSync(root))return [];return fs.readdirSync(root,{withFileTypes:true}).flatMap(e=>e.isDirectory()?walk(path.join(root,e.name)):[path.join(root,e.name)]);}
          for(const root of ['node_modules/vinext','dist']){
            for(const f of walk(root).filter(x=>/\/(?:link(?:-[\w-]+)?|app-rsc-cache-busting(?:-[\w-]+)?)\.(?:js|mjs|tsx)$/.test(x)).slice(0,25)){
              const s=fs.readFileSync(f,'utf8');const p=s.indexOf('RSC prefetch setup error');console.log('\nFILE',f,'BYTES',s.length,'ERROR_OFFSET',p);console.log('HEAD',s.slice(0,1700));
              if(p>=0){console.log('ERROR_CONTEXT',s.slice(Math.max(0,p-1300),p+550));const lines=s.split('\n');console.log('LINE_2_AT_4352',lines[1]?.slice(3850,4800));}
            }
          }
          NODE
      - name: Preserve lab diagnostics
        if: always()
        run: echo 'No deploy; this workflow is diagnostics-only.' >> "$GITHUB_STEP_SUMMARY"
