name: Vinext RSC prefetch regression lab (NO DEPLOY)
on:
  push:
    branches: [fix/vinext-rsc-prefetch-20260921]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frozen install, static checks and production build
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm install --frozen-lockfile
          corepack pnpm lint
          corepack pnpm exec tsc --noEmit
          corepack pnpm build
      - name: Pinpoint faulty export and original declaration
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';
          const dir='dist/client/_next/static/chunks';const f=fs.readdirSync(dir).find(f=>/^index-.*\.js$/.test(f));const index=fs.readFileSync(path.join(dir,f),'utf8');
          console.log('INDEX FILE',f,'length',index.length);
          for(const re of [/\bfunction\s+is\s*\(/g,/\b(?:let|const|var)\s+is\s*=/g,/\bis\s*=/g,/getPrefetchInterceptionContext/g]){
            console.log('REGEX',re.source,[...index.matchAll(re)].slice(0,8).map(m=>({p:m.index,source:index.slice(Math.max(0,m.index-420),m.index+900)})));
          }
          console.log('INDEX tail',index.slice(-420));
          const src='node_modules/vinext/dist/client/navigation.js';
          const nav=fs.existsSync(src)?fs.readFileSync(src,'utf8'):'';
          console.log('navigation file exists',!!nav,'length',nav.length);
          for(const term of ['getPrefetchInterceptionContext','getMountedSlotsHeader','export {']){
            const matches=[...nav.matchAll(new RegExp(term.replaceAll(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g'))];console.log('NAV',term,'matches',matches.length,matches.slice(0,6).map(m=>nav.slice(Math.max(0,m.index-500),m.index+850)));
          }
          NODE
      - name: Preserve lab diagnostics
        if: always()
        run: echo 'No deploy; diagnostics only.' >> "$GITHUB_STEP_SUMMARY"
