name: Issue 8 - local production performance (NO DEPLOY)
on:
  push:
    branches:
      - perf/issue-8-prod-images-20260920
  workflow_dispatch:
permissions:
  contents: read
jobs:
  perf-laboratory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Environment and exact revision
        run: |
          node --version
          git rev-parse HEAD
          echo 'PROD DEPLOY BLOCKED: repository is a noindex prototype, no published production URL or deployment authorization established.'
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Install using locked dependencies
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
          corepack pnpm --version
      - name: Static checks on exact source revision
        run: |
          corepack pnpm lint 2>&1 | tee "$RUNNER_TEMP/lint-baseline.log"
          corepack pnpm exec tsc --noEmit
      - name: Production-mode build (not deployment)
        run: corepack pnpm build 2>&1 | tee "$RUNNER_TEMP/prod-build.log"
      - name: Browser setup
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-perf" --no-audit --no-fund playwright@1.56.0
          "$RUNNER_TEMP/browser-perf/node_modules/.bin/playwright" install chromium
      - name: Three-repeat production-mode browser baseline
        shell: bash
        run: |
          set -euo pipefail
          corepack pnpm start > "$RUNNER_TEMP/prod-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            code=$(curl -sS --noproxy '*' --max-time 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/ || true)
            if [ "$code" = '200' ]; then ready=1; break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then echo 'Production-mode server unavailable'; cat "$RUNNER_TEMP/prod-server.log"; exit 1; fi
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/browser-perf/node_modules/playwright" BASE_URL='http://127.0.0.1:8787' PERF_STAGE=baseline QA_OUTPUT=qa-artifacts/perf node scripts/tests/production-perf.mjs
      - name: Evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-8-baseline-${{ github.run_id }}
          path: |
            qa-artifacts/perf/
            ${{ runner.temp }}/lint-baseline.log
            ${{ runner.temp }}/prod-build.log
            ${{ runner.temp }}/prod-server.log
          if-no-files-found: ignore
